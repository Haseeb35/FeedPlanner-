<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">How FeedPlanner works</title>
  <desc id="d">1. Plan: add photos and drag them into place. 2. Schedule: write captions and pick dates. 3. Post: open Today and press Post now.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1280" height="300" rx="24" fill="#f5f4f0"/>
  <text x="640" y="56" fill="#c4452a" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">HOW IT WORKS</text>

  <!-- connectors -->
  <path d="M420 172 H470" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M810 172 H860" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- 1 Plan -->
  <g transform="translate(60 84)">
    <rect width="360" height="176" rx="18" fill="#ffffff" stroke="#e7e5e4"/>
    <circle cx="44" cy="44" r="22" fill="#fbe4dc"/>
    <text x="44" y="51" fill="#c4452a" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="80" y="52" fill="#1c1917" font-size="24" font-weight="700">Plan</text>
    <text x="24" y="98" fill="#57534e" font-size="16">Add photos and drag them around</text>
    <text x="24" y="122" fill="#57534e" font-size="16">until your profile looks right.</text>
    <g transform="translate(262 22)">
      <rect width="22" height="28" rx="3" fill="#f2c9a0"/><rect x="24" width="22" height="28" rx="3" fill="#8fa58c"/><rect x="48" width="22" height="28" rx="3" fill="#c4452a"/>
      <rect y="30" width="22" height="28" rx="3" fill="#d9e2e6"/><rect x="24" y="30" width="22" height="28" rx="3" fill="#2b1d17"/><rect x="48" y="30" width="22" height="28" rx="3" fill="#e9ede4"/>
    </g>
    <text x="24" y="154" fill="#a8a29e" font-size="13">Grid · Order · Colours · Feed look</text>
  </g>

  <!-- 2 Schedule -->
  <g transform="translate(470 84)">
    <rect width="340" height="176" rx="18" fill="#ffffff" stroke="#e7e5e4"/>
    <circle cx="44" cy="44" r="22" fill="#fbe4dc"/>
    <text x="44" y="51" fill="#c4452a" font-size="20" font-weight="800" text-anchor="middle">2</text>
    <text x="80" y="52" fill="#1c1917" font-size="24" font-weight="700">Schedule</text>
    <text x="24" y="98" fill="#57534e" font-size="16">Write captions, add hashtag sets</text>
    <text x="24" y="122" fill="#57534e" font-size="16">and give every post a date.</text>
    <g transform="translate(258 22)" fill="none" stroke="#c4452a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="54" height="50" rx="7"/><path d="M2 22 H56 M16 1 V11 M42 1 V11"/><path d="M18 38 l7 7 l14 -14"/>
    </g>
    <text x="24" y="154" fill="#a8a29e" font-size="13">Calendar · Auto-schedule · Reminders</text>
  </g>

  <!-- 3 Post -->
  <g transform="translate(860 84)">
    <rect width="360" height="176" rx="18" fill="#1c1917"/>
    <circle cx="44" cy="44" r="22" fill="#c4452a"/>
    <text x="44" y="51" fill="#fafaf9" font-size="20" font-weight="800" text-anchor="middle">3</text>
    <text x="80" y="52" fill="#fafaf9" font-size="24" font-weight="700">Post</text>
    <text x="24" y="98" fill="#d6d3d1" font-size="16">Open Today, press Post now. It copies</text>
    <text x="24" y="122" fill="#d6d3d1" font-size="16">the caption and hands the photo over.</text>
    <g transform="translate(286 22)" fill="none" stroke="#f97352" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 4 L2 24 L22 32 L30 52 Z"/><path d="M50 4 L22 32"/>
    </g>
    <text x="24" y="154" fill="#a8a29e" font-size="13">Mark as posted · on to the next one</text>
  </g>
</svg>
