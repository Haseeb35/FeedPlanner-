<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">FeedPlanner</title>
  <desc id="d">See your Instagram profile before you post. Plan the grid, schedule captions and post each day.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#2d211c"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <clipPath id="phone"><rect x="836" y="46" width="300" height="420" rx="26"/></clipPath>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#card)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="-40" r="260" fill="#c4452a" opacity="0.18"/>
  <circle cx="760" cy="470" r="200" fill="#8fa58c" opacity="0.12"/>

  <!-- Logo -->
  <rect x="80" y="70" width="52" height="52" rx="13" fill="#fafaf9" opacity="0.08"/>
  <g fill="#f97352" transform="translate(80 70) scale(1.625)">
    <rect x="7" y="7" width="5" height="5" rx="1"/><rect x="13.5" y="7" width="5" height="5" rx="1"/><rect x="20" y="7" width="5" height="5" rx="1"/>
    <rect x="7" y="13.5" width="5" height="5" rx="1"/><rect x="13.5" y="13.5" width="5" height="5" rx="1" fill="#fafaf9"/><rect x="20" y="13.5" width="5" height="5" rx="1"/>
    <rect x="7" y="20" width="5" height="5" rx="1"/><rect x="13.5" y="20" width="5" height="5" rx="1"/><rect x="20" y="20" width="5" height="5" rx="1"/>
  </g>
  <text x="148" y="106" fill="#fafaf9" font-size="26" font-weight="700">FeedPlanner</text>

  <text x="80" y="190" fill="#fafaf9" font-size="52" font-weight="800" letter-spacing="-1.5">See your profile</text>
  <text x="80" y="250" fill="#f97352" font-size="52" font-weight="800" letter-spacing="-1.5">before you post.</text>
  <text x="80" y="298" fill="#d6d3d1" font-size="20">Plan your Instagram grid, schedule every caption,</text>
  <text x="80" y="326" fill="#d6d3d1" font-size="20">and post each day in the right order.</text>

  <g font-size="14" font-weight="600">
    <rect x="80" y="352" width="128" height="32" rx="16" fill="#fafaf9" opacity="0.1"/>
    <text x="144" y="373" fill="#fafaf9" text-anchor="middle">No account</text>
    <rect x="218" y="352" width="168" height="32" rx="16" fill="#fafaf9" opacity="0.1"/>
    <text x="302" y="373" fill="#fafaf9" text-anchor="middle">Photos stay private</text>
    <rect x="396" y="352" width="148" height="32" rx="16" fill="#fafaf9" opacity="0.1"/>
    <text x="470" y="373" fill="#fafaf9" text-anchor="middle">Works offline</text>
  </g>

  <!-- Phone with a planned grid -->
  <rect x="826" y="36" width="320" height="440" rx="34" fill="#0c0a09" stroke="#44403c" stroke-width="2"/>
  <g clip-path="url(#phone)">
    <rect x="836" y="46" width="300" height="420" fill="#fafaf9"/>
    <circle cx="880" cy="98" r="26" fill="#c4452a"/>
    <rect x="920" y="80" width="110" height="10" rx="5" fill="#292524"/>
    <rect x="920" y="100" width="40" height="8" rx="4" fill="#78716c"/>
    <rect x="976" y="100" width="40" height="8" rx="4" fill="#78716c"/>
    <rect x="1032" y="100" width="40" height="8" rx="4" fill="#78716c"/>
    <rect x="856" y="136" width="170" height="7" rx="3.5" fill="#a8a29e"/>
    <g transform="translate(836 158)">
      <!-- row 1 -->
      <rect width="99" height="132" fill="#f2c9a0"/>
      <circle cx="40" cy="48" r="18" fill="#8c3a22"/>
      <path d="M0 90 Q50 70 99 92 V132 H0Z" fill="#c4452a"/>
      <rect x="100.5" width="99" height="132" fill="#e8e2d6"/>
      <path d="M125 132 V70 a25 25 0 0 1 50 0 V132Z" fill="#8fa58c"/>
      <circle cx="150" cy="72" r="9" fill="#f3ece2"/>
      <rect x="201" width="99" height="132" fill="#f6e5dc"/>
      <circle cx="250" cy="66" r="40" fill="#3a2a22"/><circle cx="250" cy="66" r="32" fill="#e8735a"/><circle cx="250" cy="66" r="22" fill="#f3c2b0"/><circle cx="250" cy="66" r="13" fill="#d9573d"/>
      <!-- row 2 -->
      <rect y="133.5" width="99" height="132" fill="#d9e2e6"/>
      <circle cx="50" cy="240" r="28" fill="#f2c9a0"/>
      <rect x="100.5" y="133.5" width="99" height="132" fill="#e9ede4"/>
      <path d="M100.5 265.5 l25 -50 l20 35 l20 -45 l34 60Z" fill="#8fa58c"/>
      <rect x="201" y="133.5" width="99" height="132" fill="#c4452a"/>
      <path d="M201 230 L300 160 V200 L201 265Z" fill="#2b1d17"/>
      <circle cx="262" cy="203" r="12" fill="#f3ece2"/>
      <!-- row 3 -->
      <rect y="267" width="99" height="132" fill="#2b1d17"/>
      <path d="M30 400 V320 a20 20 0 0 1 40 0 V400Z" fill="#c9a08a"/>
      <rect x="100.5" y="267" width="99" height="132" fill="#f3ece2"/>
      <path d="M100.5 360 Q150 330 199.5 360 V399 H100.5Z" fill="#e0b99a"/>
      <rect x="201" y="267" width="99" height="132" fill="#8fa58c"/>
      <circle cx="250" cy="320" r="22" fill="#f3ece2" opacity="0.85"/>
    </g>
  </g>
</g>
</svg>
